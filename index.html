<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIDEC Pump Control</title>

<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#f4f7fb,#0d1117);
  --surface:light-dark(#fff,#161b22);
  --surface2:light-dark(#f8fafc,#1c2128);
  --text:light-dark(#172033,#f0f3f6);
  --muted:light-dark(#667085,#9da7b3);
  --border:light-dark(#dfe5ec,#30363d);
  --accent:light-dark(#1667d9,#4ea1ff);
  --danger:light-dark(#c62828,#ff6b6b)
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text)
}

#app{
  min-height:100vh;
  background:var(--bg);
  padding:20px
}

.wrap{
  max-width:760px;
  margin:auto
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.title{
  font-size:25px;
  font-weight:800
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px
}

.badge{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--surface)
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#35a853
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.05)
}

.speedrow{
  display:flex;
  justify-content:space-between;
  align-items:end
}

.label{
  font-size:14px;
  color:var(--muted)
}

.speed{
  font-size:56px;
  font-weight:800;
  line-height:1
}

.unit{
  font-size:20px;
  color:var(--muted);
  margin-left:4px
}

.range{
  width:100%;
  margin:24px 0 10px;
  accent-color:var(--accent)
}

.ticks{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px
}

.btn{
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer
}

.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white
}

.btn.stop{
  background:var(--danger);
  border-color:var(--danger);
  color:white
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.stat{
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface2)
}

.stat b{
  display:block;
  font-size:19px;
  margin-top:4px
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin-top:12px
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:16px
}

@media(max-width:520px){
  #app{padding:14px}
  .card{padding:16px}
  .speed{font-size:48px}
  .grid{grid-template-columns:1fr}
  .buttons{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="app">
<div class="wrap">

  <div class="top">
    <div>
      <div class="title">NIDEC Pump Control</div>
      <div class="sub">Remote dashboard</div>
    </div>

    <div class="badge">
      <span class="dot"></span>
      <span id="conn">CHECKING...</span>
    </div>
  </div>

  <div class="card">

    <div class="speedrow">
      <div>
        <div class="label">Pump speed command</div>
      </div>

      <div>
        <span id="speed" class="speed">0</span>
        <span class="unit">%</span>
      </div>
    </div>

    <input
      id="slider"
      class="range"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <div class="ticks">
      <span>0%</span>
      <span>25%</span>
      <span>50%</span>
      <span>75%</span>
      <span>100%</span>
    </div>

    <div class="buttons">
      <button class="btn primary" id="send">
        Kirim perintah
      </button>

      <button class="btn stop" id="stop">
        STOP
      </button>
    </div>

  </div>

  <div class="card">

    <div class="label">Status perangkat</div>

    <div class="grid" style="margin-top:10px">

      <div class="stat">
        <div class="label">ESP8266</div>
        <b id="device">OFFLINE</b>
      </div>

      <div class="stat">
        <div class="label">Speed feedback</div>
        <b id="feedback">--%</b>
      </div>

      <div class="stat">
        <div class="label">RPM</div>
        <b>-- RPM</b>
      </div>

      <div class="stat">
        <div class="label">Flow</div>
        <b>-- L/min</b>
      </div>

    </div>

    <div class="note">
      Dashboard terhubung ke backend NIDEC.
    </div>

  </div>

  <div class="footer">
    NIDEC • ESP8266 • HiveMQ Cloud
  </div>

</div>
</div>

<script>

const API_BASE =
  "https://nidecpumpesp.de.deplexo.com";

const slider =
  document.getElementById("slider");

const speed =
  document.getElementById("speed");

const feedback =
  document.getElementById("feedback");

const conn =
  document.getElementById("conn");

const device =
  document.getElementById("device");


slider.addEventListener("input", () => {

  speed.textContent = slider.value;

});


async function refreshStatus(){

  try{

    const response =
      await fetch(API_BASE + "/api/status");

    if(!response.ok){
      throw new Error("Backend offline");
    }

    const data =
      await response.json();

    const value =
      Number(data.speed);

    if(Number.isFinite(value)){

      feedback.textContent =
        value + "%";

      slider.value =
        value;

      speed.textContent =
        value;

    }

    if(data.mqtt){

      conn.textContent =
        "BACKEND ONLINE";

      device.textContent =
        "CONNECTED";

    }else{

      conn.textContent =
        "MQTT OFFLINE";

      device.textContent =
        "OFFLINE";

    }

  }catch(error){

    conn.textContent =
      "BACKEND OFFLINE";

    device.textContent =
      "OFFLINE";

  }

}


async function sendSpeed(value){

  try{

    const response =
      await fetch(API_BASE + "/api/speed", {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          speed:Number(value)
        })

      });

    if(!response.ok){

      throw new Error("Command failed");

    }

    await refreshStatus();

  }catch(error){

    alert(
      "Backend belum terhubung."
    );

  }

}


document
  .getElementById("send")
  .addEventListener("click", () => {

    sendSpeed(slider.value);

  });


document
  .getElementById("stop")
  .addEventListener("click", () => {

    slider.value = 0;
    speed.textContent = "0";

    sendSpeed(0);

  });


window.addEventListener("load", () => {

  refreshStatus();

  setInterval(
    refreshStatus,
    2000
  );

});

</script>

</body>
</html>
